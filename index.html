<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chaman Collectibles - Ruleta Mística</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chaman: {
                            bg: '#000105',        /* Negro azulado */
                            blue: '#136FD7',      /* Azul eléctrico */
                            violet: '#531BD0',    /* Violeta místico */
                            cyan: '#25CCE3',      /* Cian brillante */
                            jade: '#29C193',      /* Verde jade */
                            gold: '#D3AD71',      /* Dorado premium */
                        }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000105;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(83, 27, 208, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(19, 111, 215, 0.15) 0%, transparent 50%);
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            touch-action: manipulation;
        }

        .glass-panel {
            background: rgba(0, 1, 5, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(211, 173, 113, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        .gold-border-glow {
            border: 2px solid #D3AD71;
            box-shadow: 0 0 15px rgba(211, 173, 113, 0.3), inset 0 0 10px rgba(211, 173, 113, 0.2);
        }

        /* Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #29C193;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #29C193;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 1, 5, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: #531BD0;
            border-radius: 3px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 select-none overflow-x-hidden">

    <!-- HEADER -->
    <header class="max-w-7xl mx-auto w-full mb-4">
        <div class="glass-panel rounded-2xl p-3 md:p-4 flex items-center justify-between gold-border-glow">
            <div class="flex items-center gap-3">
                <!-- LOGO CABECERA CON RECORTE CIRCULAR CSS -->
                <div class="relative w-12 h-12 md:w-14 md:h-14 rounded-full p-0.5 bg-gradient-to-tr from-[#D3AD71] via-[#25CCE3] to-[#531BD0] shadow-[0_0_12px_rgba(37,204,227,0.4)]">
                    <img id="headerLogoImg" src="DelfoLogo.jpeg" alt="Chaman Logo" 
                         onerror="this.src='https://via.placeholder.com/150/000105/D3AD71?text=CHAMAN'"
                         class="w-full h-full object-cover rounded-full bg-[#000105]">
                </div>
                <div>
                    <h1 class="font-cinzel text-lg md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#D3AD71] via-[#25CCE3] to-[#ffffff] tracking-wider leading-none">
                        CHAMAN
                    </h1>
                    <p class="text-[10px] md:text-xs text-[#25CCE3] font-bold tracking-widest uppercase">Ruleta Mística de Premios</p>
                </div>
            </div>

            <!-- CONTADOR DE PREMIOS RESTANTES -->
            <div class="flex items-center gap-2 bg-[#531BD0]/30 border border-[#531BD0] px-3 py-1.5 md:px-4 md:py-2 rounded-xl">
                <i class="fa-solid fa-layer-group text-[#25CCE3] text-sm md:text-base"></i>
                <div class="text-right">
                    <span class="block text-[9px] md:text-[10px] text-gray-300 font-bold uppercase tracking-wider">Premios Restantes</span>
                    <span id="totalSpotsBadge" class="font-bold text-base md:text-lg text-[#25CCE3] leading-none">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- PANEL PRINCIPAL (LAYOUT OPTIMIZADO PARA TABLETS) -->
    <main class="max-w-7xl mx-auto w-full grid grid-cols-1 md:grid-cols-12 gap-4 md:gap-6 my-auto">
        
        <!-- COLUMNA IZQUIERDA: CONTROLES Y CONFIGURACIÓN (5 cols en tablet) -->
        <section class="md:col-span-5 flex flex-col gap-4 order-2 md:order-1">
            
            <!-- PANEL DE CONTROL DEL LOGO -->
            <div class="glass-panel p-3.5 md:p-4 rounded-2xl border border-[#D3AD71]/40">
                <label class="block text-xs text-[#D3AD71] font-bold mb-2 uppercase tracking-wider flex items-center justify-between">
                    <span class="flex items-center gap-2">
                        <i class="fa-solid fa-image text-[#25CCE3]"></i> Logo Personalizado
                    </span>
                    <span class="text-[10px] text-gray-400 font-normal">Recorte circular</span>
                </label>
                <div class="space-y-2">
                    <div class="flex gap-2">
                        <label for="logoFileInput" class="flex-1 h-10 bg-[#136FD7] hover:bg-[#136FD7]/80 text-white text-xs font-bold rounded-xl px-3 flex items-center justify-center gap-2 cursor-pointer transition-all active:scale-95 shadow-md">
                            <i class="fa-solid fa-upload"></i> Subir de la Tablet
                        </label>
                        <input type="file" id="logoFileInput" accept="image/*" onchange="handleLogoFileUpload(event)" class="hidden">
                        <button onclick="resetLogoUrl()" title="Restablecer logo original" class="h-10 px-3 bg-[#000105] border border-[#D3AD71]/40 hover:border-[#D3AD71] text-[#D3AD71] rounded-xl transition-all flex items-center justify-center active:scale-95">
                            <i class="fa-solid fa-rotate-left text-xs"></i>
                        </button>
                    </div>
                    <input type="text" id="logoUrlInput" placeholder="DelfoLogo.jpeg o URL https://"
                        value="DelfoLogo.jpeg"
                        oninput="handleLogoUrlChange(this.value)"
                        class="w-full h-9 bg-[#000105]/90 border border-[#D3AD71]/30 focus:border-[#25CCE3] text-white text-xs rounded-xl px-3 outline-none transition-all font-medium placeholder-gray-500">
                </div>
            </div>

            <!-- AGREGAR PREMIOS -->
            <div class="glass-panel p-3.5 md:p-4 rounded-2xl border border-[#D3AD71]/40">
                <h3 class="text-xs font-bold text-[#D3AD71] uppercase tracking-wider mb-2 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-[#29C193]"></i> Ingresar Premio
                </h3>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="itemInput" placeholder="Ej. Carta Charizard Holo" 
                        class="flex-1 h-11 bg-[#000105] border border-[#531BD0]/60 focus:border-[#25CCE3] text-white text-sm rounded-xl px-3 outline-none font-semibold placeholder-gray-500">
                    <input type="number" id="qtyInput" value="1" min="1" max="99" 
                        class="w-16 h-11 bg-[#000105] border border-[#531BD0]/60 focus:border-[#25CCE3] text-white text-sm font-bold text-center rounded-xl outline-none">
                    <button onclick="addItem()" class="h-11 px-4 bg-[#136FD7] hover:bg-[#136FD7]/80 text-white font-bold text-sm rounded-xl transition-all active:scale-95 flex items-center gap-1 shadow-md">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
                <div class="flex gap-2">
                    <button onclick="loadPresetData()" class="flex-1 py-1.5 bg-[#531BD0]/30 border border-[#531BD0] hover:bg-[#531BD0]/50 text-[#25CCE3] text-xs font-bold rounded-lg transition-all">
                        <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Cargar Ejemplos TCG
                    </button>
                    <button onclick="clearAllItems()" class="py-1.5 px-3 bg-red-950/40 border border-red-500/40 hover:bg-red-900/60 text-red-300 text-xs font-bold rounded-lg transition-all">
                        <i class="fa-solid fa-trash-can"></i> Vaciar
                    </button>
                </div>
            </div>

            <!-- OPCOINES Y CONFIGURACIÓN DE AUTO-ELIMINAR -->
            <div class="glass-panel p-3.5 md:p-4 rounded-2xl border border-[#D3AD71]/40 flex items-center justify-between">
                <div class="pr-2">
                    <span class="block text-xs font-bold text-[#D3AD71] uppercase tracking-wider">Eliminar premio al salir</span>
                    <span class="text-[10px] text-gray-400">Resta 1 unidad del acumulado al ganar</span>
                </div>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="autoRemoveToggle" class="sr-only peer" checked>
                    <div class="w-11 h-6 bg-gray-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#29C193]"></div>
                </label>
            </div>

            <!-- LISTA DE PREMIOS ACTIVOS -->
            <div class="glass-panel p-3.5 md:p-4 rounded-2xl border border-[#D3AD71]/40 flex-1 min-h-[160px] flex flex-col">
                <h3 class="text-xs font-bold text-[#D3AD71] uppercase tracking-wider mb-2 flex items-center justify-between">
                    <span><i class="fa-solid fa-list-check text-[#136FD7] mr-1"></i> Lista de Premios</span>
                    <span id="uniqueCountBadge" class="text-[10px] text-gray-400">0 tipos</span>
                </h3>
                <div id="itemList" class="flex-1 overflow-y-auto max-h-[180px] space-y-1.5 pr-1">
                    <!-- Slices rendered by JS -->
                </div>
            </div>

        </section>

        <!-- COLUMNA DERECHA: RULETA CANVAS Y BOTONES DE ACCIÓN (7 cols en tablet) -->
        <section class="md:col-span-7 flex flex-col items-center justify-center gap-4 order-1 md:order-2">
            
            <!-- CONTENEDOR RULETA -->
            <div class="relative w-full max-w-[380px] sm:max-w-[440px] md:max-w-[480px] aspect-square flex items-center justify-center p-2">
                <!-- FLECHA / INDICADOR SUPERIOR -->
                <div class="absolute top-0 left-1/2 -translate-x-1/2 z-30 drop-shadow-[0_4px_10px_rgba(0,0,0,0.8)]">
                    <div class="w-0 h-0 border-l-[16px] border-l-transparent border-r-[16px] border-r-transparent border-t-[32px] border-t-[#D3AD71]"></div>
                    <div class="w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-t-[22px] border-t-[#25CCE3] absolute -top-[30px] left-1/2 -translate-x-1/2"></div>
                </div>

                <!-- CANVAS RULETA -->
                <canvas id="wheelCanvas" class="w-full h-full drop-shadow-[0_0_25px_rgba(83,27,208,0.4)]"></canvas>
            </div>

            <!-- BOTONES GIRAR Y RANDOMIZAR -->
            <div class="w-full max-w-[420px] flex gap-3">
                <button id="spinBtn" onclick="spinWheel()" 
                    class="flex-2 flex-1 h-14 bg-gradient-to-r from-[#136FD7] via-[#531BD0] to-[#136FD7] text-white font-cinzel font-black text-xl rounded-2xl shadow-[0_0_20px_rgba(19,111,215,0.5)] border border-[#25CCE3]/50 hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> GIRAR
                </button>
                <button onclick="shuffleWheel()" 
                    class="h-14 px-5 bg-[#000105] border-2 border-[#D3AD71] text-[#D3AD71] hover:bg-[#D3AD71]/10 font-bold text-sm rounded-2xl transition-all active:scale-95 flex flex-col items-center justify-center leading-tight">
                    <i class="fa-solid fa-shuffle text-base mb-0.5"></i>
                    <span class="text-[10px] tracking-wider uppercase">Mezclar</span>
                </button>
            </div>

            <!-- HISTORIAL DE LOS ÚLTIMOS 5 GIROS -->
            <div class="w-full max-w-[420px] glass-panel p-3 rounded-2xl border border-[#D3AD71]/30">
                <h4 class="text-[11px] font-bold text-[#D3AD71] uppercase tracking-wider mb-2 flex items-center gap-1.5">
                    <i class="fa-solid fa-clock-rotate-left text-[#25CCE3]"></i> Historial (Últimos 5)
                </h4>
                <div id="historyList" class="flex flex-wrap gap-1.5 min-h-[32px] items-center">
                    <span class="text-xs text-gray-500 italic">No hay giros recientes</span>
                </div>
            </div>

        </section>

    </main>

    <!-- MODAL GANADOR ESTILO TCG -->
    <div id="winnerModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-sm w-full p-6 rounded-3xl border-2 border-[#D3AD71] shadow-[0_0_50px_rgba(37,204,227,0.4)] text-center relative overflow-hidden transform transition-all scale-95 opacity-0" id="winnerModalCard">
            <div class="absolute -top-12 -left-12 w-32 h-32 bg-[#531BD0]/40 rounded-full blur-2xl"></div>
            <div class="absolute -bottom-12 -right-12 w-32 h-32 bg-[#25CCE3]/30 rounded-full blur-2xl"></div>

            <div class="relative z-10">
                <span class="inline-block px-3 py-1 bg-[#531BD0]/40 border border-[#25CCE3] text-[#25CCE3] text-xs font-bold rounded-full uppercase tracking-widest mb-3">
                    ✨ ¡Premio Obtenido! ✨
                </span>
                <h2 id="winnerTitle" class="font-cinzel text-2xl font-black text-white mb-2 drop-shadow-md">---</h2>
                <p id="winnerSubtitle" class="text-xs text-[#29C193] font-semibold mb-6">Ha sido reclamado de la ruleta</p>

                <button onclick="closeWinnerModal()" 
                    class="w-full h-12 bg-gradient-to-r from-[#136FD7] to-[#531BD0] text-white font-bold text-sm rounded-xl border border-[#D3AD71] shadow-lg hover:brightness-110 active:scale-95 transition-all">
                    CONTINUAR
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LÓGICA -->
    <script>
        // CONFIGURACIÓN DE COLORES
        const PALETTE = ['#136FD7', '#531BD0', '#25CCE3', '#29C193', '#D3AD71'];
        
        // ESTADO GLOBAL
        let items = [
            { name: "Booster Pack Pokémon", qty: 3 },
            { name: "Carta Holo Rare", qty: 2 },
            { name: "Deck Box Premium", qty: 1 },
            { name: "Sleeves Edición Chaman", qty: 4 }
        ];

        let history = [];
        let currentRotation = 0;
        let isSpinning = false;
        let logoImage = new Image();
        let currentLogoUrl = 'DelfoLogo.jpeg';

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        // AUDIO SINTETIZADO (WEB AUDIO API)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTickSound() {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch(e){}
        }

        function playWinSound() {
            try {
                initAudio();
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + idx * 0.1);
                    osc.stop(audioCtx.currentTime + idx * 0.1 + 0.3);
                });
            } catch(e){}
        }

        // MANEJO DE LOGO
        function loadLogo(url) {
            currentLogoUrl = url;
            logoImage = new Image();
            logoImage.crossOrigin = 'anonymous';
            logoImage.src = url;
            logoImage.onload = () => drawWheel();
            logoImage.onerror = () => {
                // Fallback si falla
                logoImage.src = 'https://via.placeholder.com/150/000105/D3AD71?text=CHAMAN';
            };
            document.getElementById('headerLogoImg').src = url;
        }

        function handleLogoUrlChange(val) {
            if (val.trim()) loadLogo(val.trim());
        }

        function handleLogoFileUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    document.getElementById('logoUrlInput').value = '';
                    loadLogo(evt.target.result);
                };
                reader.readAsDataURL(file);
            }
        }

        function resetLogoUrl() {
            document.getElementById('logoUrlInput').value = 'DelfoLogo.jpeg';
            loadLogo('DelfoLogo.jpeg');
        }

        // AJUSTE DE RESOLUCIÓN CANVAS HIGH-DPI
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            drawWheel();
        }

        // EXPANDIR PREMIOS POR CANTIDAD
        function getExpandedSlices() {
            const slices = [];
            items.forEach(item => {
                for (let i = 0; i < item.qty; i++) {
                    slices.push(item.name);
                }
            });
            return slices;
        }

        // DIBUJAR RULETA
        function drawWheel() {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(centerX, centerY) - 12;

            ctx.clearRect(0, 0, width, height);

            const slices = getExpandedSlices();
            const totalSlices = slices.length;

            if (totalSlices === 0) {
                // Mensaje sin elementos
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#000105';
                ctx.fill();
                ctx.strokeStyle = '#D3AD71';
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.fillStyle = '#D3AD71';
                ctx.font = 'bold 14px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('INGRESA PREMIOS', centerX, centerY);
                ctx.restore();
                return;
            }

            const sliceAngle = (Math.PI * 2) / totalSlices;

            // Dibujar sectores
            slices.forEach((sliceText, i) => {
                const angle = currentRotation + i * sliceAngle;
                
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
                ctx.closePath();

                ctx.fillStyle = PALETTE[i % PALETTE.length];
                ctx.fill();

                ctx.strokeStyle = 'rgba(0, 1, 5, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // TEXTO DE LOS PREMIOS (TAMAÑO REDUCIDO PA QUE QUEPA)
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + sliceAngle / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                
                // Reducción dinámica de fuente según cantidad de slices
                const fontSize = totalSlices > 12 ? 9 : (totalSlices > 8 ? 10 : 12);
                ctx.font = `bold ${fontSize}px Rajdhani`;
                ctx.shadowColor = '#000000';
                ctx.shadowBlur = 4;

                const textRadius = radius - 18;
                ctx.fillText(sliceText.length > 18 ? sliceText.substring(0, 16) + '...' : sliceText, textRadius, 4);
                ctx.restore();

                ctx.restore();
            });

            // BORDE Y MARCO EXTERIOR DORADO
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = '#D3AD71';
            ctx.lineWidth = 6;
            ctx.stroke();
            ctx.restore();

            // CENTRO MEDALLÓN CON RECORTE CIRCULAR DEL LOGO
            const hubRadius = radius * 0.28;
            ctx.save();
            ctx.beginPath();
            ctx.arc(centerX, centerY, hubRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#000105';
            ctx.fill();
            ctx.strokeStyle = '#D3AD71';
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.clip(); // Recorte en círculo exacto

            if (logoImage.complete && logoImage.naturalWidth !== 0) {
                ctx.drawImage(logoImage, centerX - hubRadius, centerY - hubRadius, hubRadius * 2, hubRadius * 2);
            } else {
                ctx.fillStyle = '#D3AD71';
                ctx.font = 'bold 10px Rajdhani';
                ctx.textAlign = 'center';
                ctx.fillText('CHAMAN', centerX, centerY);
            }
            ctx.restore();
        }

        // LÓGICA DEL GIRO CON FÍSICAS SUAVES
        let lastTickSector = -1;

        function spinWheel() {
            const slices = getExpandedSlices();
            if (slices.length === 0 || isSpinning) return;

            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            const totalSlices = slices.length;
            const sliceAngle = (Math.PI * 2) / totalSlices;

            // Vueltas aleatorias
            const extraRounds = 5 + Math.floor(Math.random() * 4);
            const randomTargetAngle = Math.random() * Math.PI * 2;
            const targetRotation = currentRotation + (extraRounds * Math.PI * 2) + randomTargetAngle;

            const startTime = performance.now();
            const duration = 4500; // 4.5 segundos

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Easing cubic out
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentRotation = currentRotation + (targetRotation - currentRotation) * 0.08;

                // Sonido de Tick al pasar de sector
                const currentSector = Math.floor((Math.PI * 2 - (currentRotation % (Math.PI * 2))) / sliceAngle) % totalSlices;
                if (currentSector !== lastTickSector) {
                    playTickSound();
                    lastTickSector = currentSector;
                }

                drawWheel();

                if (progress < 0.995) {
                    requestAnimationFrame(animate);
                } else {
                    currentRotation = targetRotation;
                    drawWheel();
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    
                    // CALCULAR GANADOR (Indicador en 270 grados - arriba)
                    const normalizedRotation = (currentRotation % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                    const pointerAngle = (Math.PI * 1.5 - normalizedRotation + Math.PI * 2) % (Math.PI * 2);
                    const winningIndex = Math.floor(pointerAngle / sliceAngle) % totalSlices;
                    const winnerName = slices[winningIndex];

                    handleWin(winnerName);
                }
            }

            requestAnimationFrame(animate);
        }

        // PROCESAR PREMIO GANADOR
        function handleWin(winnerName) {
            playWinSound();

            // Agregar a historial
            history.unshift({ name: winnerName, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
            if (history.length > 5) history.pop();
            renderHistory();

            // Auto-eliminar si está activo
            const autoRemove = document.getElementById('autoRemoveToggle').checked;
            if (autoRemove) {
                const itemObj = items.find(i => i.name === winnerName);
                if (itemObj) {
                    itemObj.qty -= 1;
                    if (itemObj.qty <= 0) {
                        items = items.filter(i => i.name !== winnerName);
                    }
                }
                renderItems();
            }

            // Mostrar Modal
            document.getElementById('winnerTitle').innerText = winnerName;
            document.getElementById('winnerSubtitle').innerText = autoRemove ? 'Premio descontado de la ruleta' : 'Permanece en la ruleta';
            const modal = document.getElementById('winnerModal');
            const card = document.getElementById('winnerModalCard');
            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeWinnerModal() {
            const card = document.getElementById('winnerModalCard');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                document.getElementById('winnerModal').classList.add('hidden');
            }, 200);
        }

        // MEZCLAR / RANDOMIZAR
        function shuffleWheel() {
            if (isSpinning) return;
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            renderItems();
        }

        // AGREGAR ELEMENTO
        function addItem() {
            const nameInput = document.getElementById('itemInput');
            const qtyInput = document.getElementById('qtyInput');
            const name = nameInput.value.trim();
            const qty = parseInt(qtyInput.value) || 1;

            if (!name) return;

            const existing = items.find(i => i.name.toLowerCase() === name.toLowerCase());
            if (existing) {
                existing.qty += qty;
            } else {
                items.push({ name, qty });
            }

            nameInput.value = '';
            qtyInput.value = '1';
            renderItems();
        }

        function removeItem(index) {
            items.splice(index, 1);
            renderItems();
        }

        function clearAllItems() {
            items = [];
            renderItems();
        }

        function loadPresetData() {
            items = [
                { name: "Booster Pack Pokémon", qty: 4 },
                { name: "Carta Holo Rare", qty: 2 },
                { name: "Deck Box Premium", qty: 1 },
                { name: "Sleeves Edición Chaman", qty: 5 },
                { name: "Playmat Ilustrado", qty: 1 }
            ];
            renderItems();
        }

        // RENDERIZAR LISTAS Y BADGES
        function renderItems() {
            const listEl = document.getElementById('itemList');
            listEl.innerHTML = '';

            let totalSpots = 0;

            items.forEach((item, idx) => {
                totalSpots += item.qty;
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-2 rounded-xl bg-[#000105]/80 border border-[#531BD0]/40 text-xs";
                div.innerHTML = `
                    <span class="font-semibold text-white truncate max-w-[170px]">${item.name}</span>
                    <div class="flex items-center gap-2">
                        <span class="px-2 py-0.5 bg-[#136FD7]/30 border border-[#136FD7] text-[#25CCE3] font-bold rounded-md">${item.qty}</span>
                        <button onclick="removeItem(${idx})" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `;
                listEl.appendChild(div);
            });

            document.getElementById('totalSpotsBadge').innerText = totalSpots;
            document.getElementById('uniqueCountBadge').innerText = `${items.length} tipos`;
            drawWheel();
        }

        function renderHistory() {
            const el = document.getElementById('historyList');
            if (history.length === 0) {
                el.innerHTML = '<span class="text-xs text-gray-500 italic">No hay giros recientes</span>';
                return;
            }
            el.innerHTML = history.map(h => `
                <div class="flex items-center gap-1.5 px-2.5 py-1 bg-[#531BD0]/20 border border-[#531BD0] rounded-lg text-xs">
                    <span class="text-white font-bold">${h.name}</span>
                    <span class="text-[9px] text-[#25CCE3]">${h.time}</span>
                </div>
            `).join('');
        }

        // INICIALIZACIÓN
        window.addEventListener('load', () => {
            loadLogo('DelfoLogo.jpeg');
            renderItems();
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        });
    </script>
</body>
</html>
